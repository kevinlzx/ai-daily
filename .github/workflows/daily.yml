name: daily-ai-intel

on:
  schedule:
    # every day 22:00 UTC = 06:00 Beijing
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch raw sources
        run: python -m src.fetch
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

      - name: Generate daily report
        run: python -m src.generate

      - name: Render platform versions
        run: python -m src.publish

      - name: Build docx for batch import
        run: python -m src.to_docx

      - name: Commit outputs
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ data/raw.json
          git diff --cached --quiet && echo "no changes" || git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push
